name: Studio tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install clip test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run the existing Studio suite
        run: node --test tests/*.test.mjs
